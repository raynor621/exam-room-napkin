<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf9f3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<title>Knee Arthritis · Dr. Raynor</title>
<meta name="description" content="Knee osteoarthritis explained on a 3D knee: what it is, why it hurts, treatment options and knee replacement. M. Brett Raynor, M.D., Texas Orthopaedic Associates.">
<style>
/* Knee arthritis: the same look as the rest of the napkin app (paper, navy, system sans, a dark 3D stage). */
:root {
  --paper: #fbf9f3; --paper-2: #f2eee3; --ink: #1e2a44; --ink-soft: #5b6478;
  --tendon: #cf5546; --hot: #d63a2f; --bursa: #4f8fc9; --navy: #14325c; --navy-soft: #cfe1f5;
  --chip-bg: #ffffff; --chip-fg: #14325c; --chip-on-bg: #14325c; --chip-on-fg: #ffffff;
  --shadow: 0 10px 30px rgba(20, 30, 60, .18);
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b2230; --paper-2: #232c3d; --ink: #eaeef7; --ink-soft: #a9b3c7; --tendon: #e2705f; --hot: #ff6b5e; --bursa: #72b3f0;
    --navy: #9cc4ee; --navy-soft: #2a4466; --chip-bg: #232c3d; --chip-fg: #d6e4f7; --chip-on-bg: #9cc4ee; --chip-on-fg: #0f1a2b;
    --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b2230; --paper-2: #232c3d; --ink: #eaeef7; --ink-soft: #a9b3c7; --tendon: #e2705f; --hot: #ff6b5e; --bursa: #72b3f0;
  --navy: #9cc4ee; --navy-soft: #2a4466; --chip-bg: #232c3d; --chip-fg: #d6e4f7; --chip-on-bg: #9cc4ee; --chip-on-fg: #0f1a2b;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
/* the patient view stays light, like the rest of While You Wait */
html.pt { --paper: #fbf9f3; --paper-2: #f2eee3; --ink: #1e2a44; --ink-soft: #5b6478; --tendon: #cf5546; --navy: #14325c;
  --chip-bg: #ffffff; --chip-fg: #14325c; --chip-on-bg: #14325c; --chip-on-fg: #ffffff; color-scheme: light; }

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.35;
  overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 3px solid var(--bursa); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; box-sizing: border-box; position: relative; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding-block: 8px; flex-wrap: wrap; }
.bar h1 { font-weight: 700; font-size: 26px; margin: 0; line-height: 1; letter-spacing: -.2px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 14px; border: 2px solid var(--navy); border-radius: 999px;
  background: var(--chip-bg); color: var(--chip-fg); font-weight: 600; font-size: 16px; cursor: pointer; user-select: none; -webkit-user-select: none;
  touch-action: manipulation; text-decoration: none; box-sizing: border-box; }
.btn.on { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
.btn.ghost[aria-pressed="false"] { opacity: .55; }
.btn svg { width: 20px; height: 20px; }
.seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 999px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; min-height: 40px; padding: 4px 14px; }
.seg .btn + .btn { border-left: 2px solid var(--navy); }
.js-ptback { display: none; }
html.handoff .js-ptback { display: inline-flex; }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 35%, #2a4169 0%, #16233d 55%, #0c1526 100%); }
.stage .gl { position: absolute; inset: 0; }
.stage .gl canvas { display: block; touch-action: none; cursor: grab; }
.stage canvas.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
.stage.drawing-mode canvas.ink { pointer-events: auto; cursor: crosshair; }
.stage.drawing-mode::after { content: 'Drawing on. Tap Draw again to turn it off.'; position: absolute; left: 12px; top: 10px; font-size: 13px; color: #fff;
  background: rgba(214,58,47,.85); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.k3-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.k3-labels[hidden] { display: none; }
.k3-label { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 15px var(--font-ui); color: #14325c; background: rgba(255,255,255,.92);
  padding: 3px 9px; border-radius: 999px; opacity: 0; transition: opacity .25s; will-change: transform; }
.k3-label.on { opacity: 1; }
.hint { position: absolute; right: 12px; top: 10px; font-size: 13px; color: #c7d0e4; background: rgba(12,21,38,.55); padding: 4px 10px; border-radius: 999px;
  pointer-events: none; transition: opacity .6s; }
.hint.gone { opacity: 0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #e3e9f5; font: 600 18px var(--font-ui); background: rgba(12,21,38,.55); z-index: 2; }
.loading[hidden] { display: none; }
.cue { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px; text-align: center; pointer-events: none; font-size: 18px; color: #e3e9f5;
  line-height: 1.3; text-wrap: balance; background: linear-gradient(to top, rgba(12,21,38,.94) 55%, transparent); }
.cue:empty, .cue.hidden { display: none; }
.credit { position: absolute; left: 12px; top: 10px; font-size: 11px; color: rgba(199,208,228,.7); pointer-events: none; }
.stage.drawing-mode .credit { display: none; }

/* ---------- chips ---------- */
.chips { display: flex; flex-direction: column; gap: 8px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); width: 84px; flex: 0 0 auto; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 18px; border: 2px solid var(--navy); border-radius: 999px;
  background: var(--chip-bg); color: var(--chip-fg); font-weight: 600; font-size: 17px; cursor: pointer; user-select: none; -webkit-user-select: none;
  touch-action: manipulation; transition: background .15s, color .15s, transform .08s; box-sizing: border-box; }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.chip.action { border-style: double; border-width: 4px; }
.chip.card-chip { border-style: dashed; }
.chip .dots { display: inline-flex; gap: 4px; }
.chip .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; display: block; }
.chip .dots i.f { background: currentColor; }
.nav { margin-left: auto; display: inline-flex; gap: 8px; }
.nav .chip { border-radius: 14px; font-weight: 700; }
.nav .chip.primary { background: var(--chip-on-bg); color: var(--chip-on-fg); }

/* ---------- cards ---------- */
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
  background: color-mix(in srgb, #0c1526 55%, transparent); z-index: 5; }
.overlay.open { display: flex; }
.card { width: min(800px, 100%); max-height: 100%; overflow: auto; background: var(--paper); color: var(--ink); border-radius: 20px; box-shadow: var(--shadow);
  padding: 16px 22px 14px; box-sizing: border-box; border: 2px solid var(--ink); }
.card h2 { font-size: 28px; font-weight: 700; margin: 0 0 4px; line-height: 1.1; text-wrap: balance; letter-spacing: -.3px; }
.card .sub { color: var(--ink-soft); margin: 0 0 10px; font-size: 15px; }
.card p { margin: 8px 0; font-size: 18px; max-width: 64ch; }
.card ul { margin: 6px 0; padding-left: 1.2em; }
.card li { font-size: 17px; margin: 5px 0; }
.card .close { margin-top: 10px; }
.card section { display: none; }
.card section.show { display: block; }
.ladder { display: grid; gap: 6px; margin: 6px 0 2px; }
.rung { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding: 7px 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper-2); }
.rung b { font-size: 24px; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.rung .t { font-weight: 700; font-size: 17px; }
.rung .q { color: var(--ink-soft); font-size: 14.5px; }
.rung .r { font-size: 12px; font-weight: 700; color: var(--navy); background: var(--navy-soft); border-radius: 999px; padding: 3px 9px; white-space: nowrap; align-self: center; }
.rung.top { border-style: dashed; }
.facts { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.fact { flex: 1 1 200px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
.fact b { display: block; font-size: 30px; color: var(--tendon); line-height: 1.05; }
.fact span { font-size: 15px; color: var(--ink-soft); }
.srcline { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
.srcline a { color: inherit; }
.qr-wrap { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.qr-wrap > div:last-child { flex: 1 1 260px; min-width: 0; }
.qr { flex: 0 0 auto; width: 190px; height: 190px; background: #fff; padding: 8px; border-radius: 12px; box-sizing: border-box; }
.qr svg { width: 100%; height: 100%; display: block; }
.url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; word-break: break-all; }

/* ---------- patient view ---------- */
.pt-bar, .pt-panel, .pt-cover { display: none; }
html.pt .bar, html.pt .chips, html.pt .cue { display: none; }
html.pt.handoff .bar, html.pt.handoff .chips { display: flex; }
html.pt.handoff .cue:not(:empty):not(.hidden) { display: block; }
html.pt.handoff .pt-bar, html.pt.handoff .pt-panel { display: none !important; }
html.pt .pt-bar { display: flex; align-items: center; gap: 14px; padding-block: 10px 8px; }
html.pt .pt-panel { display: block; padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px)); }
html.pt .pt-cover.open { display: flex; }
html.embedded .k-only, html:not(.embedded) .e-only { display: none !important; }
html.embedded .js-pt-topics { display: none !important; }
.pt-bar h1 { font-weight: 700; font-size: 26px; margin: 0; line-height: 1; letter-spacing: -.2px; }
.js-pt-handoff { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.pt-chapter { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.pt-progress { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
.pt-progress i { display: block; height: 100%; width: 0; background: var(--navy); border-radius: 3px; transition: width .35s ease; }
.pt-caption { margin: 12px 0 14px; font-size: clamp(18px, 2.1vw, 24px); line-height: 1.4; color: var(--ink); text-wrap: pretty; min-height: calc(3 * 1.4em); max-width: 72ch; }
.pt-caption.in { animation: ptfade .35s ease; }
@keyframes ptfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pt-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pt-count { flex: 1; text-align: center; color: var(--ink-soft); font-size: 15px; font-variant-numeric: tabular-nums; }
.pt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; padding: 10px 26px; border: 2px solid var(--navy);
  border-radius: 16px; background: var(--chip-bg); color: var(--chip-fg); font: 700 20px var(--font-ui); cursor: pointer; user-select: none;
  -webkit-user-select: none; touch-action: manipulation; text-decoration: none; box-sizing: border-box; }
.pt-btn:active { transform: scale(.98); }
.pt-btn.primary { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.pt-btn[hidden] { display: none; }
.pt-cover { position: absolute; inset: 0; z-index: 20; background: var(--paper); overflow: auto; align-items: flex-start; justify-content: center;
  padding: 24px 16px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
.pt-sheet { width: 100%; max-width: 1000px; margin: auto; }
.pt-welcome { display: grid; grid-template-columns: 230px 1fr; gap: 40px; align-items: center; }
.pt-head { width: 230px; height: 230px; border-radius: 50%; object-fit: cover; display: block; border: 5px solid var(--paper-2); box-shadow: var(--shadow); }
.pt-eyebrow { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--tendon); }
.pt-cover h1 { font-size: clamp(30px, 4vw, 46px); font-weight: 800; line-height: 1.05; letter-spacing: -.5px; margin: 6px 0 14px; text-wrap: balance; }
.pt-lead { font-size: clamp(18px, 2vw, 22px); line-height: 1.45; margin: 0 0 22px; max-width: 60ch; }
.pt-ask { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
.pt-sides { display: flex; gap: 14px; flex-wrap: wrap; }
.pt-sides .pt-btn { flex: 1 1 220px; min-height: 70px; font-size: 22px; }
.pt-fine { font-size: 14px; color: var(--ink-soft); margin: 18px 0 0; }
.ptlink { background: none; border: 0; padding: 4px 8px; color: var(--navy); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.pt-fine .ptlink { font-size: 14px; padding: 0 0 0 6px; }
.pt-brand { display: flex; align-items: center; gap: 20px; margin-top: 24px; flex-wrap: wrap; }
.pt-brand img { height: 66px; width: auto; display: block; }
.pt-brand-rule { width: 1px; height: 52px; background: color-mix(in srgb, var(--ink) 25%, transparent); }
/* end screen: the at-home reference */
.pt-end h1 { margin-bottom: 8px; }
.pt-end .pt-lead { margin-bottom: 16px; }
.pt-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
.pt-box { background: var(--paper-2); border: 2px solid color-mix(in srgb, var(--ink) 18%, transparent); border-radius: 18px; padding: 16px 22px; }
.pt-box h2 { font-size: 20px; margin: 0 0 8px; }
.pt-box ul, .pt-box ol { margin: 0; padding-left: 1.2em; }
.pt-box li { font-size: 18px; line-height: 1.38; margin: 7px 0; }
.pt-box.wide { grid-column: 1 / -1; }
.pt-box .ladder .rung { background: var(--paper); }
.faq details { border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); padding: 10px 0; }
.faq details:first-of-type { border-top: 0; }
.faq summary { font-size: 18px; font-weight: 700; cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::before { content: '+'; color: var(--navy); font-weight: 800; width: 14px; flex: 0 0 auto; }
.faq details[open] summary::before { content: '\2212'; }
.faq details p { margin: 8px 0 0 24px; font-size: 17px; line-height: 1.45; }
.sources ol { padding-left: 1.4em; }
.sources li { font-size: 13.5px; line-height: 1.4; margin: 4px 0; color: var(--ink-soft); }
.sources a { color: inherit; word-break: break-word; }
.pt-endnav { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; align-items: center; }
.pt-call { font-size: 19px; font-weight: 700; margin: 18px 0 0; }
.pt-call a { color: var(--navy); }
.pt-qr { display: flex; gap: 18px; align-items: center; }
.pt-qr .qr { width: 150px; height: 150px; }

@media (max-width: 760px) {
  .pt-welcome { grid-template-columns: 1fr; gap: 14px; justify-items: center; text-align: center; }
  .pt-head { width: 130px; height: 130px; }
  .pt-lead { margin-inline: auto; }
  .pt-cols { grid-template-columns: 1fr; }
  .pt-btn { min-height: 52px; padding: 8px 18px; font-size: 18px; }
  .pt-bar h1 { font-size: 22px; }
  .pt-chapter { display: none; }
  .pt-caption { font-size: 17px; min-height: calc(5 * 1.4em); margin: 8px 0 10px; }
  .pt-brand { justify-content: center; gap: 12px; flex-wrap: nowrap; }
  .pt-brand img { height: 37px; }
  .pt-brand-rule { height: 38px; }
  .pt-end { text-align: left; }
  .pt-box { padding: 12px 16px; }
  .pt-box li { font-size: 16px; }
  .rung { grid-template-columns: 26px 1fr; }
  .rung .r { grid-column: 2; justify-self: start; }
  .bar h1 { font-size: 22px; }
  .chip { min-height: 46px; font-size: 15px; padding: 6px 13px; }
  .row .k { display: none; }
  .cue { font-size: 15px; }
  .k3-label { font-size: 13px; }
}
@media (max-height: 700px) and (max-width: 760px) { .pt-caption { min-height: calc(4 * 1.4em); } }
@media (max-width: 1300px) { .bar { gap: 6px; } .bar .btn.ghost { padding: 6px 8px; font-size: 15px; } .bar h1 { font-size: 23px; } .seg .btn { padding: 4px 11px; } }
@media (max-width: 1100px) { .row .k { width: 64px; } .chip { padding: 8px 14px; } .bar .js-clear { display: none; } }
@media (max-width: 900px) { .bar .js-undo, .bar .js-cues { display: none; } }
@media (prefers-reduced-motion: reduce) { .pt-caption.in { animation: none; } .pt-progress i { transition: none; } .chip { transition: none; } }
/* embedded in a website page: a vertical swipe scrolls the host page */
html.embedded .stage .gl canvas { touch-action: pan-y !important; }

html.pt .credit { top: auto; bottom: 8px; }
@media (max-width: 600px) {
  .pt-bar { gap: 8px !important; padding-block: 8px 6px !important; }
  .pt-bar h1 { font-size: 19px; line-height: 1.15; white-space: nowrap; }
  .pt-bar .btn { min-height: 36px; padding: 4px 6px; font-size: 14px; gap: 3px; white-space: nowrap; }
  .hint { display: none; }
}
.stage.card-open .cue { visibility: hidden; }

</style>

-joint loads in overweight and obese older adults with knee osteoarthritis. Arthritis Rheum. 2005;52:2026-32",url:"https://doi.org/10.1002/art.21139"},juni:{label:"J\xFCni P, et al. Intra-articular corticosteroid for knee osteoarthritis. Cochrane Database Syst Rev. 2015;(10):CD005328",url:"https://doi.org/10.1002/14651858.CD005328.pub3"},mcalindon:{label:"McAlindon TE, et al. Effect of intra-articular triamcinolone vs saline on knee cartilage volume and pain. JAMA. 2017;317:1967-75",url:"https://doi.org/10.1001/jama.2017.5283"},englund:{label:"Englund M, et al. Incidental meniscal findings on knee MRI in middle-aged and elderly persons. N Engl J Med. 2008;359:1108-15",url:"https://doi.org/10.1056/NEJMoa0800777"},moseley:{label:"Moseley JB, et al. A controlled trial of arthroscopic surgery for osteoarthritis of the knee. N Engl J Med. 2002;347:81-8",url:"https://doi.org/10.1056/NEJMoa013259"},kirkley:{label:"Kirkley A, et al. A randomized trial of arthroscopic surgery for osteoarthritis of the knee. N Engl J Med. 2008;359:1097-107",url:"https://doi.org/10.1056/NEJMoa0708333"},evans:{label:"Evans JT, et al. How long does a knee replacement last? Lancet. 2019;393:655-63",url:"https://doi.org/10.1016/S0140-6736(18)32531-5"},bourne:{label:"Bourne RB, et al. Patient satisfaction after total knee arthroplasty: who is satisfied and who is not? Clin Orthop Relat Res. 2010;468:57-63",url:"https://doi.org/10.1007/s11999-009-1119-9"},deshpande:{label:"Deshpande BR, et al. Number of persons with symptomatic knee osteoarthritis in the US: impact of race and ethnicity, age, sex, and obesity. Arthritis Care Res (Hoboken). 2016;68:1743-50",url:"https://doi.org/10.1002/acr.22897"},bricca:{label:"Bricca A, et al. Impact of exercise on articular cartilage in people at risk of, or with established, knee osteoarthritis: a systematic review of randomised controlled trials. Br J Sports Med. 2019;53:940-7",url:"https://doi.org/10.1136/bjsports-2017-098661"},mautner:{label:"Mautner K, et al. Cell-based versus corticosteroid injections for knee pain in osteoarthritis: a randomized phase 3 trial. Nat Med. 2023;29:3120-6",url:"https://doi.org/10.1038/s41591-023-02632-w"},milhem:{label:"Milhem F, et al. Genicular artery embolization for knee osteoarthritis: a systematic review of sham-controlled randomized trials. J Orthop. 2025;67:361-8",url:"https://doi.org/10.1016/j.jor.2025.07.022"},skou:{label:"Skou ST, et al. A randomized, controlled trial of total knee replacement. N Engl J Med. 2015;373:1597-606",url:"https://doi.org/10.1056/NEJMoa1505467"},habib:{label:"Habib GS, et al. Increased blood glucose levels following intra-articular injection of methylprednisolone acetate in patients with controlled diabetes and symptomatic osteoarthritis of the knee. Ann Rheum Dis. 2008;67:1790-1",url:"https://doi.org/10.1136/ard.2008.089722"}},Zu=["What arthritis is","Why it hurts","Treatment","Knee replacement"],In=[{ch:0,view:"inside",knee:{wear:0},text:"The ends of the bones in the knee are covered with smooth, slippery cartilage (blue). Between the thigh bone and the shin bone sit two menisci, cushions that absorb shock."},{ch:0,view:"inside",knee:{wear:2},text:"Osteoarthritis is the gradual wearing away of this cartilage (shown in tan). On an X-ray, the space between the bones reflects the cartilage, so as the cartilage thins, that space narrows."},{ch:0,view:"front",knee:{wear:3},text:"When the cartilage in one area is gone, bone rubs on bone. The body responds by forming bone spurs along the edges of the joint, and the meniscus on that side often frays and tears."},{ch:0,view:"kneecap",knee:{wear:3,comp:"pf"},text:"Arthritis can affect the inner side of the knee, the outer side, or the joint behind the kneecap. Many knees have some wear in more than one area."},{ch:1,view:"front",knee:{wear:3,flare:!0},text:"Pain comes mainly from the irritated bone and joint lining. During a flare, the knee becomes inflamed and produces extra fluid (blue), causing swelling and stiffness. Swelling can also make the thigh muscle feel weak."},{ch:1,view:"inside",knee:{wear:3},text:"How the knee feels matters more than how the X-ray looks. Many people with advanced changes on X-ray have few symptoms, and flares often settle with treatment. The goal is a knee that feels good enough for you to stay active."},{ch:2,view:"side",knee:{wear:2},text:"The most effective treatment is to keep the knee strong, active and moving. Exercise does not wear the knee out faster, and it is strongly recommended by the American Academy of Orthopaedic Surgeons.",src:["aaos","bricca"]},{ch:2,view:"front",knee:{wear:2},text:"For people who are overweight, weight loss helps: each pound lost removes about 4 pounds of load from the knee with every step. Anti-inflammatory medicines, taken by mouth or applied as a gel, and acetaminophen can ease flares.",src:["messier05","aaos"]},{ch:2,view:"front",knee:{wear:3,flare:!0,inject:"play"},dwell:4500,text:"A steroid (cortisone) injection calms the inflammation. It is placed at the upper outer side of the knee, where the medicine spreads throughout the joint. Relief usually lasts several weeks, and for some people up to a few months.",src:["juni","aaos"]},{ch:2,view:"front",knee:{wear:3,brace:!0},text:"If injections stop lasting, other options include an unloader brace that shifts weight away from the worn side, a gel (hyaluronic acid) injection, although the national guideline does not recommend gel for routine use, and newer procedures that target the nerves or blood vessels around the knee.",src:["aaos","milhem"]},{ch:3,view:"replace",knee:{replace:1},text:"When arthritis is advanced and other treatments no longer control the pain, a knee replacement is the most reliable option. The worn surfaces are removed and the ends of the bones are reshaped.",src:["skou"]},{ch:3,view:"replace",knee:{replace:2},text:"The ends of the bones are capped with metal, with a smooth plastic liner between them. About 9 in 10 knee replacements are still working 20 years later.",src:["evans"]}],Ju={start:"A healthy knee: smooth cartilage on the ends of the bones, a meniscus cushion on each side.",wear1:"Early arthritis: the cartilage starts to thin.",wear2:"Moderate arthritis: the cartilage is worn and the joint space narrows.",wear3:"Advanced arthritis: bone on bone, with bone spurs at the edges.",medial:"Wear on the inner side of the knee.",lateral:"Wear on the outer side of the knee.",pf:"Wear behind the kneecap: its underside and the groove it glides in.",meniscus:"The meniscus on the worn side frays and tears as part of the arthritis.",flare:"A flare: the bone and joint lining are inflamed, and the knee fills with fluid.",inject:"A steroid injection at the upper outer knee spreads throughout the joint.",brace:"An unloader brace shifts weight away from the worn side.",apart:"Knee replacement: the worn surfaces are removed and the bone ends reshaped.",together:"Metal caps the bones, with a plastic liner between them.",inside:"Inside the knee, with the kneecap set aside.",front:"The knee from the front.",side:"The knee from the side."},fr=[{set:{wear:0},view:"inside",cue:"start"},{set:{wear:1},view:"inside",cue:"wear1"},{set:{wear:2},view:"inside",cue:"wear2"},{set:{wear:3},view:"inside",cue:"wear3"},{set:{wear:3},view:"front",cue:"wear3"},{set:{wear:3,comp:"pf"},view:"kneecap",cue:"pf"},{set:{wear:3,meniscus:!0},view:"inside",cue:"meniscus"},{set:{wear:3,flare:!0},view:"front",cue:"flare"},{set:{wear:3,flare:!0,inject:"play"},view:"front",cue:"inject"},{set:{wear:3,brace:!0},view:"front",cue:"brace"},{set:{replace:1},view:"replace",cue:"apart"},{set:{replace:2},view:"replace",cue:"together"}],kl=[{t:"Stay strong, active and moving",d:"Exercise of any kind: walking, cycling, swimming, strength training. The foundation of every plan.",r:"Strongly recommended",src:["aaos"]},{t:"Weight loss, if overweight",d:"Each pound lost removes about 4 pounds of load from the knee with every step.",r:"Recommended",src:["messier05","aaos"]},{t:"Anti-inflammatory medicine and acetaminophen",d:"Pills or a topical gel for flares, when they are safe for you.",r:"Strongly recommended",src:["aaos"]},{t:"Steroid injection",d:"Calms a flare. Dr. Raynor repeats it when an injection has given about three months of relief.",r:"Moderate support for short-term relief",src:["aaos","juni"]},{t:"Unloader brace",d:"Shifts weight away from a worn inner side, for long days on your feet.",r:"Moderate support",src:["aaos"]},{t:"Gel injection",d:"An option for some patients when steroid injections stop lasting. Coverage depends on your insurance.",r:"Not recommended for routine use",src:["aaos"]},{t:"PRP and newer procedures",d:"Platelet-rich plasma, nerve ablation or artery embolization for selected patients.",r:"Limited evidence",src:["aaos","milhem"]},{t:"Knee replacement",d:"For advanced arthritis when other treatments no longer control the pain.",r:"Most reliable for advanced arthritis",src:["skou"]}],zl=["The numbing medicine can make the knee feel very good for a few hours. Take it easy for the rest of the day.","The steroid usually starts working within a few days. Give it a full week before judging the result.","If you have diabetes, your blood sugar may run higher for a few days.","Call the office if there is no improvement after a week, or when the relief wears off.","Call right away for increasing redness, warmth, fever or severe pain, which can be signs of infection (rare)."],$u=["habib"],pr={when:["Arthritis is advanced on X-ray.","Injections and other treatments no longer give lasting relief.","Knee pain limits daily life or sleep."],what:"The worn surfaces are removed and replaced with metal components and a plastic liner. Walking usually begins the day of surgery.",facts:[{k:"9 in 10",v:"still working at 20 years",src:["evans"]},{k:"8 in 10",v:"still working at 25 years",src:["evans"]},{k:"About 8 in 10",v:"patients satisfied with the result",src:["bourne"]}],referral:"Dr. Raynor does not perform knee replacements. When it is time, he refers patients to his joint replacement partners at Texas Orthopaedic Associates."},ed=["Osteoarthritis is wear of the cartilage that lines the ends of the bones.","How the knee feels matters more than how the X-ray looks.","Staying strong, active and moving is the most effective treatment.","Injections and other treatments calm flares so you can stay active.","Knee replacement is the most reliable option when arthritis is advanced and other treatments stop working."],td=[{q:"Will staying active wear out my knee faster?",a:"No. Exercise is one of the most strongly recommended treatments for knee arthritis. Walking, cycling, swimming and strength training are all good choices.",src:["aaos"]},{q:"Why did I get arthritis?",a:"The main factors are genetics, the alignment and shape of the bones, prior knee injuries such as a meniscus or ACL tear, and body weight. Knee arthritis is very common: about 14 million adults in the United States have symptoms from it.",src:["deshpande"]},{q:"Is the meniscus tear on my MRI causing my pain?",a:"Usually the arthritis is the main source of pain. Meniscus tears show up on MRI in 19 to 56 percent of people age 50 and older, depending on age and sex, and about 6 in 10 of them have no knee pain.",src:["englund"]},{q:"How many steroid injections can I have?",a:"Injections are generally spaced at least three months apart and used to calm flares, not on a fixed schedule. In one study, injections every three months for two years led to slightly more cartilage loss than saline, without better pain relief.",src:["mcalindon"]},{q:"Can arthroscopic surgery clean out the arthritis?",a:"Not reliably. Arthroscopy cannot restore lost cartilage, and clinical trials found it worked no better than sham surgery and added nothing to physical therapy and medicines. The guideline recommends against it for knee arthritis.",src:["moseley","kirkley","aaos"]},{q:"Do PRP or stem cell injections regrow cartilage?",a:"No injection regrows cartilage. PRP may relieve symptoms in some patients with mild to moderate arthritis and is usually not covered by insurance. Stem cell injections have not worked better than a steroid injection in a large clinical trial.",src:["aaos","mautner"]},{q:"Will an unloader brace help?",a:"It can help when the inner side of the knee is worn, by shifting weight toward the healthier side. It is worn as needed, especially for long days on your feet.",src:["aaos"]},{q:"When should I consider a knee replacement?",a:"When arthritis is advanced and the pain limits daily life despite other treatments. Dr. Raynor does not perform knee replacements; he refers patients to his joint replacement partners when the time comes."}];var nd="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAEsASwDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAQihiZd5AxISnGQ7zgTd8ZBnCXGfyG1x0MH3vZ6RjLg++7emNIisPdl0GrpU5ijIWVjprshU8urvavMGKuCByRqhHkNdkZsHvPTWxLENipFDEsn2PZog0IzfG8UofTNLkNpkZaWwwzDoEunKNIypiE6PDubrA/VOgb5bSS2NPahchKNKV9JFSQTRdcECkiOU2R12Ui1/brVWmNEOiuX02tT9Hs2WUKTtkVRfRpkrzLNJh0RhfXjvCfgwLgDByV4eqpIrjKpoPqgJoUksT0RKw9ou8a6pLmLC4Yh0CI5nWyuNKLfdT0BopYoTh2lOVVkWaRQRpBKhtialbZ0Hk7LQiYsXwZWOVdTbrEthVbkeUuE1mj1MNmLOpu0+L0qHVlMmpjzDa5RAfO+jeEHfWLXU78qghzXCdVKVwxOejG+ki4o+f/R/laqm+zWZbKbW7PHpQmaWKrOce1poPPOtZsbUU3nlQNejvLLytp15+sQL6WssoKRSEeAgMZhWmqAbKGquS8z6RdXY1TRcK5kauYZ6tChirmXyz6x89Dmwzuv5uuhnGUXGFkB113RVUQvpVUU31VIyDSgaZY4N2n05+2encaomkskQM4YI8MlUoc9rsomJ3vh/SZ86A4Rq9z5moa56uCwzKV2I22War12P2XL2WSj6X2uUR99yY6hSAVfB5QahVbXWedSaBDrhKyFt56ksUuoCGvEEytpuqFWR12SVCe75V9M52ADrmC9zBupb5atSwyqLc+9XNKNljXnL2N6M7nlX0GXzd6VqehLppoDmU957yeAdOdPQjZuYZPa42867hyrz19tNtQuDICcub6bqhTk9Zk1Qvu+VfSIcrl1gErmr3CN1GjYkQtnlTcTLrXH1OMngh99TTxDnQXJloNC
