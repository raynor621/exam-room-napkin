<title>What Does Recovery Look Like After ACL Reconstruction Surgery? · Dr. Raynor</title>
<meta name="description" content="A stage-by-stage recovery roadmap after ACL reconstruction: crutches and brace, physical therapy, driving, jogging at about 3 to 4 months, and return to sport at 7 to 9 months. M. Brett Raynor, M.D., Texas Orthopaedic Associates, Dallas.">
<style>
/* Recovery roadmaps: same look as the rest of While You Wait (paper, navy, system sans). Patient pages stay light. */
:root {
  --paper: #fbf9f3; --paper-2: #f2eee3; --card: #ffffff; --ink: #1e2a44; --ink-soft: #5b6478; --line: #e4dfd2;
  --tendon: #cf5546; --hot: #d63a2f; --bursa: #4f8fc9; --navy: #14325c; --navy-soft: #e3edf8; --done: #8fa3bf;
  --shadow: 0 6px 22px rgba(20, 30, 60, .10);
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 17px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; }
a { color: var(--navy); }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--bursa); outline-offset: 2px; }

.wrap { max-width: 780px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
.kicker { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; margin: 0 0 6px; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0 0 14px; color: var(--navy); letter-spacing: -.01em; text-wrap: balance; }
.lead { font-size: 18px; margin: 0 0 10px; }
.lead + .lead { color: var(--ink-soft); font-size: 16px; }
.pick { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
.pick a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: inherit; }
.pick a:hover, .pick a:focus-visible { border-color: var(--navy); }
.pick b { display: block; font-size: 19px; color: var(--navy); margin-bottom: 4px; }
.pick span { color: var(--ink-soft); font-size: 15px; }

/* ---------- where am I ---------- */
.tracker { margin: 22px 0 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
.tracker h2 { font-size: 17px; margin: 0 0 4px; color: var(--navy); }
.tracker p.hint { margin: 0 0 12px; font-size: 15px; color: var(--ink-soft); }
.tracker .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tracker label { font-size: 15px; font-weight: 600; }
.tracker input[type=date] { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); min-height: 44px; min-width: 170px; }
.btn { appearance: none; border: 1px solid var(--navy); background: var(--card); color: var(--navy); border-radius: 999px; padding: 9px 16px; min-height: 44px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn.solid { background: var(--navy); color: #fff; }
.btn.link { border: 0; background: none; padding: 9px 6px; text-decoration: underline; font-weight: 500; color: var(--ink-soft); }
.status { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: none; }
.status.on { display: block; }
.status .where { font-size: 20px; font-weight: 700; color: var(--navy); margin: 0 0 2px; }
.status .stage-now { margin: 0 0 6px; font-size: 16px; }
.status .next { margin: 0; font-size: 15px; color: var(--ink-soft); }

/* ---------- at a glance ---------- */
.glance { margin: 8px 0 22px; }
.glance h2, .section-h { font-size: 20px; color: var(--navy); margin: 26px 0 10px; }
.track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; position: relative; padding-top: 30px; }
.seg { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; min-width: 0; }
.seg .bar { display: block; height: 10px; border-radius: 6px; background: var(--navy-soft); position: relative; }
.seg .nm { display: block; font-weight: 700; font-size: 14px; margin-top: 8px; color: var(--navy); }
.seg .tm { display: block; font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
.seg.past .bar { background: var(--done); }
.seg.now .bar { background: var(--tendon); }
.seg.now .nm { color: var(--tendon); }
.seg:hover .bar { filter: brightness(.95); }
.you { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: #fff; background: var(--tendon);
  border-radius: 999px; padding: 3px 9px; white-space: nowrap; display: none; pointer-events: none; }
.you::after { content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 5px solid transparent; border-bottom: 0; border-top-color: var(--tendon); }
.you.on { display: block; }
@media (max-width: 600px) {
  .track { grid-template-columns: 1fr; gap: 0; padding-top: 0; }
  .seg { display: grid; grid-template-columns: 14px 1fr; column-gap: 12px; padding: 6px 0; }
  .seg .bar { grid-row: 1 / span 2; width: 10px; height: auto; min-height: 40px; }
  .seg .nm { margin-top: 0; font-size: 15px; }
  .seg .tm { font-size: 13.5px; }
  .you, .you.on { display: none !important; }
  .seg.now .you-inline { display: inline-block; }
}
.you-inline { display: none; margin-left: 8px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--tendon); border-radius: 999px; padding: 1px 8px; vertical-align: 2px; }

/* ---------- meniscus variants inside a stage ---------- */
.choices { display: grid; gap: 8px; margin: 4px 0 6px; }
.choice { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.choice h4 { margin: 0 0 4px; font-size: 15.5px; color: var(--navy); }
.choice ul { margin: 0; }
.choice li { font-size: 15.5px; }

/* ---------- stages ---------- */
.stages-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 10px; }
.stages-h .section-h { margin: 0; }
details.stage { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 10px; box-shadow: 0 1px 0 rgba(0,0,0,.02); scroll-margin-top: 12px; }
details.stage > summary { list-style: none; cursor: pointer; padding: 14px 48px 14px 18px; position: relative; display: block; }
details.stage > summary::-webkit-details-marker { display: none; }
details.stage > summary::after { content: ''; position: absolute; right: 20px; top: 50%; width: 10px; height: 10px; border-right: 2.5px solid var(--navy); border-bottom: 2.5px solid var(--navy); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
details.stage[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
.s-num { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
.s-title { display: block; font-size: 19px; font-weight: 700; color: var(--navy); line-height: 1.25; }
.s-glance { display: block; font-size: 15px; color: var(--ink-soft); margin-top: 2px; }
details.stage.now { border-color: var(--tendon); box-shadow: 0 0 0 2px rgba(207, 85, 70, .18); }
details.stage.now .s-num { color: var(--tendon); }
.now-tag { display: none; margin-left: 8px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--tendon); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; text-transform: none; vertical-align: 1px; }
details.stage.now .now-tag { display: inline-block; }
.s-body { padding: 0 18px 16px; }
.s-body p { margin: 0 0 10px; }
.s-body h3 { font-size: 15.5px; margin: 14px 0 4px; color: var(--ink); }
.s-body ul, .s-body ol { margin: 0 0 6px; padding-left: 22px; }
.s-body li { margin: 3px 0; }
.ready { margin-top: 14px; background: var(--navy-soft); border-radius: 10px; padding: 10px 14px; font-size: 15.5px; }
.ready b { color: var(--navy); }
.why { margin: 14px 0 6px; border-left: 4px solid var(--bursa); background: var(--paper); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 15.5px; }
.why h3 { margin-top: 0; color: var(--navy); }
.cite { font-size: 13px; color: var(--ink-soft); }

/* ---------- side boxes ---------- */
/* dressing videos: tap to load */
.vid { margin: 12px 0 8px; max-width: 560px; }
.vid-btn, .vid iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; overflow: hidden; background: #0f1d2e; }
.vid-btn { position: relative; padding: 0; cursor: pointer; }
.vid-btn img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
.vid-play { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: rgba(15, 29, 46, .82); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.vid-play::after { content: ''; position: absolute; left: 29px; top: 22px; border-style: solid; border-width: 14px 0 14px 22px; border-color: transparent transparent transparent #fff; }
.vid-btn:hover .vid-play, .vid-btn:focus-visible .vid-play { background: var(--navy, #1A2C46); }
.vid figcaption { font-size: 15px; margin-top: 6px; color: inherit; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 10px 0; }
.box h2 { font-size: 18px; margin: 0 0 6px; color: var(--navy); }
.box p { margin: 0 0 8px; }
.box ul { margin: 0; padding-left: 22px; }
.box li { margin: 4px 0; }
.box.call { border-color: rgba(207, 85, 70, .45); background: #fff8f6; }
.box.call h2 { color: var(--tendon); }
.phone { font-weight: 700; white-space: nowrap; }
.resources li { margin: 6px 0; }
.foot { margin-top: 26px; font-size: 14px; color: var(--ink-soft); }
.foot .sig { color: var(--ink); font-weight: 600; margin: 0; }
.foot p { margin: 0 0 4px; }
.foot .note { margin-top: 12px; font-size: 13px; }

html.embedded .wrap { padding-top: 16px; }
.backbar { display: none; margin: 0 0 14px; }
.backbar a { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--navy); text-decoration: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); min-height: 40px; }
html.inapp .backbar { display: block; }

@media print {
  body { background: #fff; font-size: 12pt; }
  .tracker .row, .btn { display: none !important; }
  details.stage, .box, .tracker { box-shadow: none; break-inside: avoid; }
  details.stage > summary::after { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

    "desc": "A stage-by-stage recovery roadmap after hip arthroscopy for FAI and a labral tear: the overnight stay, crutches, the brace and capsule precautions, the CPM, physical therapy, driving, and return to running and sport at 3 to 6 months. M. Brett Raynor, M.D., Texas Orthopaedic Associates, Dallas.",

      "The restrictions in the first few weeks are for a reason, and this page explains each one. A few patients are kept on crutches longer (six weeks) when extra cartilage work or a larger bone reshaping was done; the Protect and Walk stages spell out both versions. Your physical therapist and our team will tell you when you're ready for each step."

    return '';
  };

  const stageHTML = (s, i) =>
    '<details class="stage" id="stage-' + s.id + '" data-i="' + i + '">' +
      '<summary><span class="s-num">' + esc(s.num) + ' · ' + esc(s.timing) + '<span class="now-tag">You are here</span></span>' +
      '<span class="s-title">' + esc(s.name) + '</span>' +
      '<span class="s-glance">' + esc(s.glance) + '</span></summary>' +
      '<div class="s-body">' + s.body.map(block).join('') +
      (s.ready ? '<div class="ready"><b>' + (s.readyLabel || 'Ready for the next stage when:') + '</b> ' + s.ready + '</div>' : '') +
      '</div></details>';

  const segHTML = (s, i) =>
    '<button class="seg" type="button" data-i="' + i + '" aria-label="' + esc(s.num + ': ' + s.name + ', ' + s.timing) + '">' +
      '<span class="bar"></span><span class="nm">' + esc(s.short || s.name) + '<span class="you-inline">You are here</span></span>' +
      '<span class="tm">' + esc(s.timing) + '</span></button>';

  const boxHTML = b => '<section class="box"><h2>' + b.h + '</h2>' + (b.p ? '<p>' + b.p + '</p>' : '') + list('ul', b.ul) + '</section>';

  document.getElementById('app').innerHTML =
    (backHref ? '<p class="backbar"><a href="' + esc(backHref) + '">◀ Back to While You Wait</a></p>' : '') +
    '<p class="kicker">' + esc(R.kicker) + '</p>' +
    '<h1>' + esc(R.title) + '</h1>' +
    R.lead.map(p => '<p class="lead">' + p + '</p>').join('') +

    '<section class="tracker" aria-labelledby="tr-h">' +
      '<h2 id="tr-h">Where am I in my recovery?</h2>' +
      '<p class="hint">Enter your surgery date and we\'ll show you which stage you\'re in and what comes next. The date stays on this device only.</p>' +
      '<div class="row"><label for="sx-date">Surgery date</label>' +
        '<input id="sx-date" type="date">' +
        '<button class="btn solid" type="button" id="sx-go">Show me</button>' +
        '<button class="btn link" type="button" id="sx-clear" hidden>Clear date</button></div>' +
      '<div class="status" id="sx-status" aria-live="polite"><p class="where" id="sx-where"></p><p class="stage-now" id="sx-now"></p><p class="next" id="sx-next"></p></div>' +
    '</section>' +

    '<section class="glance" aria-labelledby="gl-h"><h2 id="gl-h">At a glance</h2>' +
      '<div class="track" id="track"><span class="you" id="you">You are here</span>' + R.stages.map(segHTML).join('') + '</div></section>' +

    '<div class="stages-h"><h2 class="section-h">Stage by stage</h2><button class="btn link" type="button" id="toggle-all">Open all stages</button></div>' +
    R.stages.map(stageHTML).join('') +

    R.boxes.map(boxHTML).join('') +

    '<section class="box call"><h2>When to call us</h2>' +
      '<p>Call the office at <a class="phone" href="' + TEL + '">' + PHONE + '</a> if you have:</p>' +
      list('ul', [
        'Pain that isn\'t controlled with your medication',
        'Significant new swelling, or drainage from an incision',
        'Fever over 101.5°F',
        'Calf pain or swelling',
        'Numbness or tingling that is new or getting worse',
        'Anything else that worries you. That\'s what we\'re here for.'
      ]) +
      '<p style="margin-top:8px"><b>If you have chest pain or trouble breathing, call 911.</b></p></section>' +

    '<section class="box resources"><h2>More resources</h2>' +
      list('ul', R.resources.map(r => '<a href="' + r[1] + '"' + LINK_TARGET + '>' + esc(r[0]) + '</a>')) + '</section>' +

    '<footer class="foot"><p class="sig">M. Brett Raynor, M.D.</p><p>Texas Orthopaedic Associates, a Division of OrthoLoneStar</p>' +
      '<p>7115 Greenville Ave, Suite 310, Dallas, TX 75231 · <a href="' + TEL + '">' + PHONE + '</a></p>' +
      '<p class="note">This is a general guide. If your own instructions from our team are different, follow those.</p></footer>';

  const $ = id => document.getElementById(id);
  const details = [...document.querySelectorAll('details.stage')];
  const segs = [...document.querySelectorAll('.seg')];
  const input = $('sx-date');

  // date helpers in local time (a date input gives YYYY-MM-DD)
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const parse = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const t0 = today();
  input.max = iso(new Date(t0.getTime() + 180 * DAY));
  input.min = iso(new Date(t0.getTime() - 3 * 365 * DAY));

  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function describe(days) {
    if (days < 0) { const n = -days; return n === 1 ? 'Your surgery is tomorrow.' : 'Your surgery is in ' + plural(n, 'day') + '.'; }
    if (days === 0) return 'Today is your surgery day.';
    if (days < 14) return 'You are ' + plural(days, 'day') + ' out from surgery.';
    if (days < 84) { const w = Math.floor(days / 7), d = days % 7; return 'You are ' + plural(w, 'week') + (d ? ' and ' + plural(d, 'day') : '') + ' out from surgery.'; }
    const m = days / 30.44, whole = Math.floor(m), half = m - whole >= 0.5;
    return 'You are about ' + whole + (half ? ' and a half' : '') + ' months out from surgery.';
  }
  function stageFor(days) {
    const S = R.stages;
    if (days < 0) return 0;
    for (let i = 0; i < S.length; i++) if (days < S[i].end) return i;
    return S.length - 1;
  }
  function nextText(i, days) {
    const S = R.stages;
    if (days < 0) {
      const f = S[0].start < 0 ? S[1] : S[0];
      return 'Coming up ' + (S[0].start < 0 ? 'next' : 'first') + ': ' + f.num + ', ' + f.name + '. Read it ahead so you know what the first two weeks look like.';
    }
    if (i === S.length - 1) return days >= S[i].end
      ? (R.done || 'You are past the usual nine-month mark. Once you pass your sport test and we clear you, you\'re back with no restrictions. Keep wearing your functional brace for sports during your first year back.')
      : (R.last || 'This is the last stage. Your sport test with your physical therapist is what clears you to return.');
    const n = S[i + 1];
    return 'Coming up next: ' + n.num + ', ' + n.name + ' (' + n.timing.toLowerCase() + ').';
  }

  function clearMarks() {
    details.forEach(d => d.classList.remove('now'));
    segs.forEach(s => s.classList.remove('now', 'past'));
    $('you').classList.remove('on');
  }

  function show(dateStr, opts) {
    const d = parse(dateStr);
    if (!d) return false;
    const days = Math.round((d.getTime() - today().getTime()) / -DAY);
    const i = stageFor(days), s = R.stages[i];
    const pre = days < 0 && s.start >= 0;  // before surgery on a roadmap with no prehab stage
    clearMarks();
    segs.forEach((g, k) => { if (k < i) g.classList.add('past'); });
    if (!pre) { segs[i].classList.add('now'); details[i].classList.add('now'); }
    if (!opts || !opts.keepOpen) details.forEach((x, k) => { x.open = k === i; });
    // marker on the wide track: position inside the current segment
    const span = s.end - s.start, frac = Math.max(0, Math.min(1, (days - s.start) / span));
    const track = $('track'), g = segs[i];
    const left = g.offsetLeft + g.offsetWidth * frac;
    const you = $('you');
    you.style.left = Math.max(40, Math.min(track.clientWidth - 40, left)) + 'px';
    you.classList.toggle('on', !pre);
    $('sx-where').textContent = describe(days);
    $('sx-now').innerHTML = (pre ? 'Your first stage will be <b>' : 'You are in <b>') + esc(s.num + ': ' + s.name) + '</b> (' + esc(s.timing.toLowerCase()) + '). <a href="#stage-' + s.id + '" id="sx-jump">Read this stage</a>';
    $('sx-next').textContent = nextText(i, days);
    $('sx-status').classList.add('on');
    $('sx-clear').hidden = false;
    $('sx-jump').addEventListener('click', e => { e.preventDefault(); details[i].open = true; details[i].scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    if (opts && opts.save) store.set(dateStr);
    return true;
  }

  $('sx-go').addEventListener('click', () => {
    if (!show(input.value, { save: true })) { input.focus(); return; }
  });
  input.addEventListener('change', () => { if (input.value) show(input.value, { save: true }); });
  $('sx-clear').addEventListener('click', () => {
    store.clear(); input.value = ''; clearMarks();
    $('sx-status').classList.remove('on'); $('sx-clear').hidden = true;
    // forget the date in the address too, so a reload does not bring it back
    try {
      const u = new URL(location.href); u.searchParams.delete('date');
      if (/^#date=/.test(u.hash)) u.hash = '';
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
    input.focus();
  });

  /* dressing videos (tap to load): the player replaces the thumbnail; closing the stage or the idle reset unloads it */
  const vidReset = root => (root || document).querySelectorAll('.vid iframe').forEach(f => {
    const fig = f.closest('.vid'); f.remove(); fig.querySelector('.vid-btn').hidden = false; });
  document.getElementById('app').addEventListener('click', e => {
    const btn = e.target.closest('.vid-btn'); if (!btn) return;
    const fig = btn.closest('.vid'), id = fig.dataset.yt;
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0&playsinline=1&modestbranding=1';
    f.title = fig.querySelector('figcaption').textContent; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
    btn.hidden = true; fig.insertBefore(f, btn);
  });
  document.querySelectorAll('#app details.stage').forEach(d => d.addEventListener('toggle', () => { if (!d.open) vidReset(d); }));
  segs.forEach((g, k) => g.addEventListener('click', () => {
    details[k].open = true;
    details[k].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));

  const toggle = $('toggle-all');
  const syncToggle = () => { toggle.textContent = details.every(d => d.open) ? 'Close all stages' : 'Open all stages'; };
  toggle.addEventListener('click', () => { const open = !details.every(d => d.open); details.forEach(d => d.open = open); syncToggle(); });
  details.forEach(d => d.addEventListener('toggle', syncToggle));

  window.addEventListener('beforeprint', () => details.forEach(d => d.open = true));
  window.addEventListener('resize', () => { if (input.value && $('you').classList.contains('on')) show(input.value, { keepOpen: true }); });

  // deep links: /recovery/acl#date=YYYY-MM-DD (the post-op email; a fragment never reaches the server) or ?date=YYYY-MM-DD, or #stage-run
  const hDate = (/^#date=(\d{4}-\d{2}-\d{2})$/.exec(location.hash) || [])[1];
  const qDate = hDate || new URLSearchParams(location.search).get('date');
  const saved = qDate || store.get();
  if (saved && parse(saved)) { input.value = saved; show(saved, { save: !!qDate }); }
  else { details[0].open = false; }
  if (location.hash && /^#stage-/.test(location.hash)) {
    const el = document.querySelector(location.hash);
    if (el) { el.open = true; setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); }
  }
  syncToggle();

  idleReset();
})();
</script>
</body>
</html>
